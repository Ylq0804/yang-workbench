<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>杨杨的工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fab">
<meta name="description" content="杨杨的粉色可爱个人工作台：计划、体重、理财、文案、拼豆、加班、习惯、番茄钟、心情与目标。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="杨杨的工作台">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --pink:#ff8fab; --pink-2:#ff6b9d; --pink-3:#ffc2d4; --pink-4:#ff9ebb;
  --bg:#fff5f8; --card:#ffffff; --text:#5b3a44; --muted:#ad8391;
  --line:#ffe1ea; --shadow:0 8px 22px rgba(255,143,171,.18); --r:20px;
  --ok:#69c79a; --warn:#ffb457;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 8% 0%, #ffe7f0 0%, var(--bg) 38%, #fffafc 100%);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#ffc9da;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#ff9ebb}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{
  width:236px;flex:0 0 236px;height:100vh;position:sticky;top:0;
  background:linear-gradient(180deg,#ffd7e5 0%,#ffe9f1 55%,#fff3f7 100%);
  padding:20px 13px 16px;display:flex;flex-direction:column;
  border-right:2px solid #ffd3e1;overflow-y:auto;
}
.brand{
  font-size:19px;font-weight:800;color:#e04b7d;text-align:center;
  margin-bottom:18px;letter-spacing:.5px;line-height:1.5;
}
.brand small{display:block;font-size:11px;font-weight:500;color:#d389a4;letter-spacing:2px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;
  cursor:pointer;font-size:14.5px;color:#7c4a5d;transition:all .18s ease;
  border:2px solid transparent;background:rgba(255,255,255,.4);user-select:none;
}
.nav-item:hover{background:#fff;transform:translateX(3px);box-shadow:0 4px 10px rgba(255,143,171,.16)}
.nav-item.active{
  background:linear-gradient(135deg,#ffa1c0,#ff6b9d);color:#fff;font-weight:700;
  border-color:#fff;box-shadow:0 7px 16px rgba(255,107,157,.35);
}
.nav-item .ico{font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.06))}
.side-foot{margin-top:auto;padding-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.side-foot .btn{flex:1;font-size:12px;padding:8px 6px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:26px 30px 46px;max-width:1240px;margin:0 auto;width:100%}
.page-head{margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:800;color:#d9447c;display:flex;align-items:center;gap:8px}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:6px}

.card{
  background:var(--card);border-radius:var(--r);padding:20px;
  box-shadow:var(--shadow);border:2px solid #fff0f5;
}
.card h3{font-size:15.5px;color:#c93f72;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt{margin-top:14px}

/* ---------- controls ---------- */
input,select,textarea{
  font-family:inherit;font-size:14px;padding:10px 13px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--text);outline:none;transition:.18s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,143,171,.16)}
input::placeholder,textarea::placeholder{color:#d7b6c2}
textarea{resize:vertical;min-height:76px;line-height:1.6}
label.fld{display:block;font-size:12.5px;color:#b56d87;margin-bottom:5px;font-weight:600}
.btn{
  font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:12px;
  padding:10px 18px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#ffa1c0,#ff6b9d);color:#fff;box-shadow:0 5px 13px rgba(255,107,157,.32)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(255,107,157,.4)}
.btn-ghost{background:#fff;color:var(--pink-2);border:2px solid var(--pink-3)}
.btn-ghost:hover{background:#fff3f7}
.btn-danger{background:#ffe3ea;color:#e04b7d}
.btn-danger:hover{background:#ffd3de}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:10px}

/* ---------- home ---------- */
.home-grid{grid-template-columns:1.2fr .8fr;align-items:stretch}
.clock-card{
  background:linear-gradient(135deg,#ffb3cd 0%,#ff8fab 55%,#ff7aa8 100%);
  color:#fff;text-align:center;padding:30px 20px;border:none;
  box-shadow:0 12px 30px rgba(255,107,157,.32);
}
.clock{font-size:56px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px rgba(180,60,105,.25)}
.clock-date{font-size:15px;margin-top:8px;opacity:.95}
.greet{font-size:14px;margin-top:14px;background:rgba(255,255,255,.24);display:inline-block;padding:6px 16px;border-radius:20px;backdrop-filter:blur(4px)}
.checkin-card{display:flex;flex-direction:column;justify-content:center;text-align:center}
.big-num{font-size:42px;font-weight:800;color:#ff5d8f;line-height:1.1}
.big-num .unit{font-size:15px;font-weight:600;color:var(--muted)}
.quote-card{grid-column:1/-1;background:linear-gradient(135deg,#fff9fc,#fff0f6)}
.quote-zh{font-size:19px;font-weight:700;color:#c93f72;line-height:1.7}
.quote-en{font-size:14.5px;color:#b07e92;margin-top:10px;line-height:1.7;font-style:italic}
.qtag{font-size:11px;color:#cfa0b4;margin-top:12px;letter-spacing:1px}

.stat-mini{background:#fff;border-radius:16px;padding:14px 16px;border:2px solid #fff0f5;box-shadow:0 5px 14px rgba(255,143,171,.12)}
.stat-mini .k{font-size:12.5px;color:var(--muted)}
.stat-mini .v{font-size:20px;font-weight:800;color:#ff5d8f;margin-top:4px}
.stat-mini .v.small{font-size:15px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-height:430px;overflow-y:auto;padding-right:4px}
.item{
  display:flex;align-items:center;gap:12px;background:#fff9fc;border:2px solid #fff0f5;
  border-radius:14px;padding:12px 14px;transition:.18s;
}
.item:hover{border-color:var(--pink-3);background:#fff5fa}
.item .grow{flex:1;min-width:0}
.item .t{font-size:14.5px;font-weight:600;color:#6b3f50;word-break:break-word}
.item .t.done{text-decoration:line-through;color:#c3a6b1;font-weight:500}
.item .m{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-word}
.chk{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2.5px solid var(--pink-3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:.18s;background:#fff;color:transparent;
}
.chk:hover{border-color:var(--pink)}
.chk.on{background:linear-gradient(135deg,#ffa1c0,#ff6b9d);border-color:transparent;color:#fff}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#ffe8f0;color:#d9447c;font-weight:700;white-space:nowrap}
.badge.in{background:#e4f7ee;color:#3fa87b}
.badge.out{background:#ffeaef;color:#e0486f}
.empty{text-align:center;padding:34px 10px;color:#d3aebb;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:8px;opacity:.85}

/* ---------- progress ---------- */
.bar{height:12px;border-radius:20px;background:#ffe8f0;overflow:hidden;flex:1;min-width:90px}
.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#ffb3cd,#ff6b9d);transition:width .4s ease}

/* ---------- bead gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.bead{background:#fff9fc;border:2px solid #fff0f5;border-radius:16px;overflow:hidden;transition:.2s;position:relative}
.bead:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(255,143,171,.22);border-color:var(--pink-3)}
.bead img{width:100%;height:130px;object-fit:cover;display:block;background:#ffeef5;cursor:pointer}
.bead .bd{padding:9px 11px}
.bead .bt{font-size:13.5px;font-weight:700;color:#6b3f50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bead .bc{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.drop{
  border:2.5px dashed var(--pink-3);border-radius:16px;padding:22px;text-align:center;
  color:#c98da6;cursor:pointer;transition:.2s;background:#fffafc;
}
.drop:hover{border-color:var(--pink);background:#fff3f8}

/* ---------- pomodoro ---------- */
.pomo-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 10px}
.pomo-time{font-size:74px;font-weight:800;color:#ff5d8f;font-variant-numeric:tabular-nums;letter-spacing:2px}
.pomo-mode{font-size:14px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.pomo-ring{position:relative;display:grid;place-items:center}
.pomo-ring .lbl{position:absolute}

/* ---------- mood ---------- */
.moods{display:flex;gap:10px;flex-wrap:wrap}
.mood-opt{
  width:62px;padding:11px 0;border-radius:15px;border:2.5px solid #fff0f5;background:#fff9fc;
  text-align:center;cursor:pointer;transition:.18s;font-size:12px;color:#a5768a;
}
.mood-opt .me{font-size:24px;display:block;margin-bottom:3px}
.mood-opt:hover{border-color:var(--pink-3);transform:translateY(-2px)}
.mood-opt.on{border-color:var(--pink-2);background:linear-gradient(135deg,#fff0f6,#ffe1ec);color:#d9447c;font-weight:700;box-shadow:0 6px 14px rgba(255,107,157,.2)}

/* ---------- misc ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;background:#fff0f6;color:#c96a90;border:1.5px solid #ffe1ea}
.hr{height:2px;background:linear-gradient(90deg,transparent,#ffe1ea,transparent);margin:16px 0;border:none}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#ffa1c0,#ff6b9d);color:#fff;padding:12px 24px;border-radius:16px;
  font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(255,107,157,.4);opacity:0;
  transition:.28s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(90,40,60,.5);display:none;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.modal.show{display:grid}
.modal img{max-width:88vw;max-height:82vh;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);border:5px solid #fff}

@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-grid{grid-template-columns:1fr}
  .clock{font-size:44px}
}
@media(max-width:720px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;padding:14px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav-item{white-space:nowrap;flex:0 0 auto;padding:9px 12px;font-size:13px}
  .side-foot{flex-wrap:nowrap}
  .main{padding:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .page-head h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🌸 杨杨的工作台<small>YANG'S WORKBENCH</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn btn-ghost btn-sm" onclick="W.exportData()">📤 导出</button>
      <button class="btn btn-ghost btn-sm" onclick="W.importData()">📥 导入</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="this.classList.remove('show')"><img id="modal-img" src="" alt="作品预览"></div>
<input type="file" id="import-file" accept="application/json" style="display:none">

<script>
/* =========================================================
   杨杨的工作台 · 纯前端本地应用
   数据全部保存在浏览器 localStorage，无需联网
   ========================================================= */

const NAV = [
  {id:'home',     icon:'🏠', name:'首页桌面'},
  {id:'plan',     icon:'📅', name:'每日计划'},
  {id:'weight',   icon:'⚖️', name:'体重管理'},
  {id:'finance',  icon:'💰', name:'理财'},
  {id:'copy',     icon:'📝', name:'文案积累'},
  {id:'bead',     icon:'🧩', name:'拼豆图纸'},
  {id:'overtime', icon:'⏰', name:'加班时长'},
  {id:'habit',    icon:'✅', name:'习惯打卡'},
  {id:'pomodoro', icon:'🍅', name:'番茄钟'},
  {id:'mood',     icon:'💗', name:'心情日记'},
  {id:'goal',     icon:'🎯', name:'目标清单'}
];

const QUOTES = [
  {zh:'你今天所付出的努力，是明天幸运的伏笔。', en:'The effort you put in today sets the stage for tomorrow’s luck.'},
  {zh:'慢慢来，比较快。', en:'Slow is smooth, and smooth is fast.'},
  {zh:'每一个不曾起舞的日子，都是对生命的辜负。', en:'Every day without dancing is a day wasted.'},
  {zh:'你只管努力，剩下的交给时间。', en:'Just work hard, and leave the rest to time.'},
  {zh:'把日子过成自己喜欢的样子。', en:'Live your days the way you like them.'},
  {zh:'小事也要认真做，认真的人会发光。', en:'Do even small things with care; careful people shine.'},
  {zh:'保持热爱，奔赴山海。', en:'Keep your passion, and head for the mountains and seas.'},
  {zh:'今天的你比昨天更好一点点，就够了。', en:'Being just a little better than yesterday is enough.'},
  {zh:'自律给你自由。', en:'Self-discipline gives you freedom.'},
  {zh:'所有的美好，都值得等待。', en:'All good things are worth waiting for.'},
  {zh:'先完成，再完美。', en:'Finish first, then perfect it.'},
  {zh:'温柔而坚定，慢慢变强。', en:'Be gentle and firm, and grow stronger slowly.'},
  {zh:'你值得这世间所有的美好。', en:'You deserve all the beauty in this world.'},
  {zh:'与其焦虑未来，不如经营当下。', en:'Instead of worrying about the future, tend to the present.'},
  {zh:'一步一个脚印，总能到达想去的地方。', en:'Step by step, you will reach where you want to go.'},
  {zh:'做喜欢的事，见想见的人。', en:'Do what you love, and meet the people you miss.'},
  {zh:'允许一切发生，然后继续向前。', en:'Allow everything to happen, then keep moving forward.'},
  {zh:'把平凡的日子，过成诗。', en:'Turn ordinary days into poetry.'},
  {zh:'你的坚持，终将美好。', en:'Your persistence will eventually blossom.'},
  {zh:'心宽一寸，路宽一丈。', en:'Broaden your heart an inch, and your road widens a yard.'},
  {zh:'愿你成为自己的太阳。', en:'May you become your own sun.'},
  {zh:'现在开始，永远不晚。', en:'It’s never too late to start now.'},
  {zh:'认真生活，就能找到生活藏起来的糖。', en:'Live earnestly, and you will find the candy life has hidden.'},
  {zh:'慢慢走，沿途有风景。', en:'Walk slowly; there are sceneries along the way.'},
  {zh:'每一份努力都算数。', en:'Every effort counts.'},
  {zh:'做温柔且有力量的人。', en:'Be a gentle and powerful person.'},
  {zh:'别慌，月亮也慢慢变圆。', en:'Don’t rush; even the moon grows round slowly.'},
  {zh:'今天也要元气满满呀！', en:'Be full of energy today too!'},
  {zh:'你很好，值得被爱。', en:'You are wonderful and worthy of love.'},
  {zh:'把热爱的事做到极致。', en:'Do what you love to the extreme.'},
  {zh:'生活明朗，万物可爱。', en:'Life is bright, and everything is lovely.'},
  {zh:'想要的生活，自己给自己。', en:'Build the life you want for yourself.'}
];

const MOODS = [
  {e:'😄', n:'开心'}, {e:'🥰', n:'幸福'}, {e:'😌', n:'平静'}, {e:'😐', n:'普通'},
  {e:'😪', n:'疲惫'}, {e:'😢', n:'低落'}, {e:'😤', n:'生气'}, {e:'🤯', n:'焦虑'}
];

/* ---------------- helpers ---------------- */
const $  = s => document.querySelector(s);
const store = {
  get(k, def){
    try{ const v = localStorage.getItem('yy_'+k); return v===null ? def : JSON.parse(v); }
    catch(e){ return def; }
  },
  set(k, v){ try{ localStorage.setItem('yy_'+k, JSON.stringify(v)); }catch(e){ toast('⚠️ 本地存储空间不足，请清理部分图片'); } }
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function dk(d){ d = d || new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
function fmtNum(n){ n = Number(n)||0; return n.toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* =========================================================
   页面渲染
   ========================================================= */
let current = 'home';

function render(){
  $('#nav').innerHTML = NAV.map(n =>
    `<div class="nav-item ${n.id===current?'active':''}" onclick="W.go('${n.id}')">
       <span class="ico">${n.icon}</span><span>${n.name}</span>
     </div>`).join('');
  $('#main').innerHTML = PAGES[current]();
  updateClock();
  if(current === 'pomodoro') Pomodoro.sync();
}

/* ---------------- 首页 ---------------- */
function quoteOfDay(){
  const d = new Date();
  const doy = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return QUOTES[doy % QUOTES.length];
}
function calcStreak(list){
  const set = new Set(list);
  const d = new Date();
  if(!set.has(dk(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(set.has(dk(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderHome(){
  const now = new Date(), today = dk();
  const ck = store.get('checkins', []);
  const checked = ck.includes(today);
  const streak = calcStreak(ck);
  const q = quoteOfDay();

  const tasks = store.get('tasks', []).filter(t=>t.date===today);
  const planDone = tasks.filter(t=>t.done).length;
  const weights = store.get('weights', []);
  const lastW = weights.length ? weights.slice().sort((a,b)=>a.date<b.date?-1:1).slice(-1)[0] : null;
  const ot = store.get('overtime', []).reduce((s,x)=>s+(Number(x.hours)||0),0);
  const fin = store.get('finance', []);
  const balance = fin.reduce((s,x)=> s + (x.type==='in'? Number(x.amount):-Number(x.amount)), 0);
  const habits = store.get('habits', []);
  const hlog = store.get('habitLog', {});
  const habitDone = habits.filter(h => (hlog[h.id]||[]).includes(today)).length;

  return `
  <div class="page-head">
    <h1>🌸 我的工作台</h1>
    <p class="sub">${today} · 欢迎回来，杨杨，今天也要元气满满哦～</p>
  </div>

  <div class="grid home-grid">
    <div class="card clock-card">

function updateClock(){
  const el = $('#clock'); if(!el) return;
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  el.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  const cd = $('#clock-date');
  if(cd) cd.textContent = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · ${WD[d.getDay()]}`;
  const g = $('#greet');
  if(g){
    const h = d.getHours();
    let s = '早上好';
    if(h>=11 && h<13) s='中午好';
    else if(h>=13 && h<18) s='下午好';
    else if(h>=18) s='晚上好';
    g.textContent = `${s}呀，杨杨 🐰`;
  }
}

/* 通用：按日期分组展示历史 */
function historyByDate(items, line){
  if(!items.length) return `<p class="muted">暂无历史记录</p>`;
  const map = {};
  items.forEach(i => { (map[i.date] = map[i.date] || []).push(i); });
  const dates = Object.keys(map).sort().reverse().slice(0,12);
  return dates.map(d => `

      </div>

}

function weightChart(data){
  if(data.length < 2) return `<p class="muted" style="padding:20px 0">至少记录 2 次才能生成曲线哦～</p>`;
  const W=520,H=200,P=34;
  const vals = data.map(d=>d.weight);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const xs = data.map((_,i)=> P + i*(W-2*P)/(data.length-1));
  const ys = vals.map(v=> H-P - (v-min)/span*(H-2*P));
  const pts = xs.map((x,i)=> x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');
  const area = `M ${xs[0]},${H-P} L ` + pts.split(' ').join(' L ') + ` L ${xs[xs.length-1]},${H-P} Z`;
  const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" fill="#ff6b9d" stroke="#fff" stroke-width="2"><title>${data[i].date}: ${data[i].weight}kg</title></circle>`).join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3cd" stop-opacity=".55"/><stop offset="100%" stop-color="#ffb3cd" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#ffe1ea" stroke-width="2"/>
    <path d="${area}" fill="url(#wg)"/>
    <polyline points="${pts}" fill="none" stroke="#ff6b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${P}" y="16" font-size="11" fill="#ad8391">${max.toFixed(1)}kg</text>
    <text x="${P}" y="${H-P-6}" font-size="11" fill="#ad8391">${min.toFixed(1)}kg</text>
  </svg>`;
}

function finBreakdown(list){
  if(!list.length) return `<p class="muted" style="padding:20px 0">本月暂无支出记录～</p>`;
  const map = {};
  list.forEach(f => map[f.cat] = (map[f.cat]||0) + Number(f.amount));
  const entries = Object.entries(map).sort((a,b)=> b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0) || 1;
  const colors = ['#ff6b9d','#ffa1c0','#ffc2d4','#ffb457','#69c79a','#9ec5ff','#c4a2ff','#ff9d8a','#8ad6e0','#e0c46a'];
  return entries.map((e,i)=>`
    <div style="margin-bottom:11px">
      <div class="row between" style="margin-bottom:4px">
        <span style="font-size:13px">${esc(e[0])}</span>
        <span style="font-size:13px;font-weight:700">¥${fmtNum(e[1])} · ${Math.round(e[1]/total*100)}%</span>
      </div>
      <div class="bar"><i style="width:${Math.round(e[1]/total*100)}%;background:${colors[i%colors.length]}"></i></div>
    </div>`).join('');
}

/* ---------------- 番茄钟 ---------------- */
const Pomodoro = {
  mode:'work', running:false, remaining:25*60, total:25*60, timer:null,
  workMin:25, breakMin:5,
  sync(){
    this.total = (this.mode==='work'?this.workMin:this.breakMin)*60;
    if(!this.running){ this.remaining = this.total; }
    this.paint();
    const cnt = store.get('pomo_'+dk(), 0);
    const el = $('#pomo-count'); if(el) el.textContent = cnt;
  },
  paint(){
    const el = $('#pomo-time'); if(!el) return;
    const m = String(Math.floor(this.remaining/60)).padStart(2,'0');
    const s = String(this.remaining%60).padStart(2,'0');
    el.textContent = m+':'+s;
    const mo = $('#pomo-mode');
    if(mo) mo.textContent = this.mode==='work' ? '专注中 🌸' : '休息一下 🍃';
    const st = $('#pomo-state');
    if(st) st.textContent = this.running ? '正在进行' : '已暂停';
    const btn = $('#pomo-btn');
    if(btn) btn.textContent = this.running ? '⏸ 暂停' : '▶ 开始';
  },
  start(){
    if(this.running) return;
    this.running = true;
    this.timer = setInterval(()=> this.tick(), 1000);
    this.paint();
  },
  pause(){ this.running=false; clearInterval(this.timer); this.timer=null; this.paint(); },
  tick(){
    this.remaining--;
    if(this.remaining <= 0){
      this.finish();
      return;
    }
    this.paint();
  },
  finish(){
    clearInterval(this.timer); this.timer=null; this.running=false;
    if(this.mode==='work'){
      store.set('pomo_'+dk(), store.get('pomo_'+dk(),0)+1);
      toast('🍅 专注完成一个番茄！休息一下吧～');
      this.mode='break';
    } else {
      toast('☕ 休息结束，继续加油呀！');
      this.mode='work';
    }
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.6);
      o.start(); o.stop(ctx.currentTime+.6);
    }catch(e){}
    this.total = (this.mode==='work'?this.workMin:this.breakMin)*60;
    this.remaining = this.total;
    this.paint(); this.sync();
  },
  reset(){ this.pause(); this.remaining = (this.mode==='work'?this.workMin:this.breakMin)*60; this.paint(); },
  switchTo(m){
    this.pause(); this.mode=m; this.total=(m==='work'?this.workMin:this.breakMin)*60; this.remaining=this.total; this.paint();
  },
  setDur(work, brk){
    this.workMin=work; this.breakMin=brk;
    this.pause();
    this.total=(this.mode==='work'?work:brk)*60; this.remaining=this.total; this.paint();
  }
};

const W = {
  go(id){ if(PAGES[id]){ current=id; render(); window.scrollTo({top:0,behavior:'smooth'}); } },

  /* 首页 */
  checkin(){
    const list = store.get('checkins', []), t = dk();
    const i = list.indexOf(t);
    if(i>=0){ list.splice(i,1); toast('已取消今日打卡～'); }
    else { list.push(t); toast('打卡成功！今天也要加油哦 💖'); }
    store.set('checkins', list); render();
  },

  /* 每日计划 */
  planAdd(){
    const el = $('#plan-input'); const text = el.value.trim();
    if(!text) return toast('先写点内容吧～');
    const list = store.get('tasks', []); list.push({id:uid(), date:dk(), text, done:false});
    store.set('tasks', list); render(); toast('已添加今日任务 ✨');
    const n=$('#plan-input'); if(n) n.focus();
  },
  planToggle(id){
    const list = store.get('tasks', []); const t = list.find(x=>x.id===id);
    if(t){ t.done = !t.done; store.set('tasks', list); render(); }
  },
  planDel(id){ store.set('tasks', store.get('tasks',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },

  /* 体重 */
  weightAdd(){
    const w = parseFloat($('#w-input').value);
    if(!w || w<=0) return toast('请输入有效的体重～');
    const list = store.get('weights', []);
    list.push({id:uid(), date:dk(), weight:Math.round(w*10)/10, note:$('#w-note').value.trim()});
    store.set('weights', list); render(); toast('体重已记录 ⚖️');
  },
  weightDel(id){ store.set('weights', store.get('weights',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },
  weightTarget(){
    const v = parseFloat($('#w-target').value);
    if(!v || v<=0) return toast('请输入有效的目标体重～');
    store.set('weightTarget', Math.round(v*10)/10); render(); toast('目标已保存 🎯');
  },

  /* 理财 */
  finAdd(){
    const amt = parseFloat($('#f-amount').value);
    if(!amt || amt<=0) return toast('请输入有效金额～');
    const list = store.get('finance', []);

               amount:Math.round(amt*100)/100, note:$('#f-note').value.trim()});

  },
  finDel(id){ store.set('finance', store.get('finance',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },
  finMonth(v){ store.set('finMonth', v); render(); },

  /* 文案 */
  copyAdd(){
    const text = $('#c-text').value.trim();
    if(!text) return toast('文案内容不能为空哦～');
    const list = store.get('snippets', []);
    list.push({id:uid(), title:$('#c-title').value.trim(), text, tags:$('#c-tags').value.trim(), date:dk()});
    store.set('snippets', list); render(); toast('文案已收藏 📝');
  },
  copyDel(id){ store.set('snippets', store.get('snippets',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },
  copySearch(v){ store.set('copyKw', v); render(); const el=$('#c-search'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } },

  /* 拼豆图纸 */
  _beadImg:null,
  beadPick(input){
    const f = input.files && input.files[0];
    if(!f) return;
    if(!f.type.startsWith('image/')) return toast('请选择图片文件～');
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxD = 700;
        let w = img.width, h = img.height;
        const sc = Math.min(1, maxD/Math.max(w,h));
        w = Math.round(w*sc); h = Math.round(h*sc);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        W._beadImg = c.toDataURL('image/jpeg', .82);
        toast('图片已就绪，填写信息后保存吧 ✨');
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  },
  beadSave(){
    if(!W._beadImg) return toast('请先选择一张图片～');
    const list = store.get('beads', []);
    list.push({id:uid(), title:$('#bead-title').value.trim(), cat:$('#bead-cat').value.trim(),
               note:$('#bead-note').value.trim(), img:W._beadImg, date:dk()});
    store.set('beads', list);
    W._beadImg = null;
    const fi=$('#bead-file'); if(fi) fi.value='';
    render(); toast('已保存到图库 🧩');
  },
  beadDel(id){ store.set('beads', store.get('beads',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },
  beadFilter(c){ store.set('beadCat', c); render(); },
  beadView(id){
    const b = store.get('beads', []).find(x=>x.id===id);
    if(!b) return;
    $('#modal-img').src = b.img; $('#modal').classList.add('show');
  },

  /* 加班 */
  otAdd(){
    const h = parseFloat($('#ot-hours').value);
    if(!h || h<=0) return toast('请输入有效的加班时长～');
    const list = store.get('overtime', []);
    list.push({id:uid(), date:$('#ot-date').value || dk(), hours:Math.round(h*10)/10, note:$('#ot-note').value.trim()});
    store.set('overtime', list); render(); toast('已记录加班 ⏰');
  },
  otDel(id){ store.set('overtime', store.get('overtime',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },

  /* 习惯 */
  habitAdd(){
    const name = $('#h-name').value.trim();
    if(!name) return toast('请填写习惯名称～');
    const habits = store.get('habits', []);
    habits.push({id:uid(), name, icon:$('#h-icon').value.trim() || '🌟'});
    store.set('habits', habits); render(); toast('习惯已添加 ✅');
  },
  habitDel(id){ store.set('habits', store.get('habits',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },
  habitToggle(id){
    const log = store.get('habitLog', {});
    const arr = log[id] || (log[id]=[]);
    const i = arr.indexOf(dk());
    if(i>=0){ arr.splice(i,1); toast('已撤销打卡～'); } else { arr.push(dk()); toast('习惯打卡成功 🌳'); }
    store.set('habitLog', log); render();
  },

  /* 番茄钟 */
  pomoToggle(){ Pomodoro.running ? Pomodoro.pause() : Pomodoro.start(); },
  pomoReset(){ Pomodoro.reset(); },
  pomoMode(m){ Pomodoro.switchTo(m); toast(m==='work'?'切换到专注模式 🍅':'切换到休息模式 🍃'); },
  pomoSet(){
    const w = parseInt($('#pomo-work').value,10), b = parseInt($('#pomo-break').value,10);
    if(!w||w<1||!b||b<1) return toast('请输入有效的时长～');
    Pomodoro.setDur(w,b); toast('设置已应用 ⚙️');
  },

  /* 心情 */
  moodPick(n){
    const moods = store.get('moods', {}), t = dk();
    moods[t] = moods[t] || {mood:'', text:''};
    moods[t].mood = n;
    store.set('moods', moods); render();
  },
  moodSave(){
    const moods = store.get('moods', {}), t = dk();
    moods[t] = moods[t] || {mood:'', text:''};
    moods[t].text = $('#mood-text').value.trim();
    store.set('moods', moods); render(); toast('今日心情已保存 💗');
  },
  moodDel(d){ const m = store.get('moods', {}); delete m[d]; store.set('moods', m); render(); toast('已删除'); },

  /* 目标 */
  goalAdd(){
    const title = $('#g-title').value.trim();
    const target = parseFloat($('#g-target').value);
    if(!title) return toast('请填写目标名称～');
    if(!target || target<=0) return toast('请填写有效的目标值～');
    const goals = store.get('goals', []);
    goals.push({id:uid(), title, target, current:parseFloat($('#g-cur').value)||0, date:$('#g-date').value, done:false});
    store.set('goals', goals); render(); toast('目标已添加 🎯');
  },
  goalUpdate(id){
    const goals = store.get('goals', []); const g = goals.find(x=>x.id===id);
    const v = parseFloat($('#gc-'+id).value);
    if(isNaN(v)) return toast('请输入新的进度值～');
    g.current = v; if(g.current >= g.target) g.done = true;
    store.set('goals', goals); render(); toast('进度已更新 📈');
  },
  goalDone(id){
    const goals = store.get('goals', []); const g = goals.find(x=>x.id===id);
    g.done = !g.done;
    if(g.done && Number(g.current) < Number(g.target)) g.current = g.target;
    store.set('goals', goals); render(); toast(g.done?'目标达成，太棒了 🏆':'已取消完成');
  },
  goalDel(id){ store.set('goals', store.get('goals',[]).filter(x=>x.id!==id)); render(); toast('已删除'); },

  /* 数据导出 / 导入 */
  exportData(){
    const data = {};
    const keys = ['checkins','tasks','weights','weightTarget','finance','finMonth','snippets','copyKw',
                  'beads','beadCat','overtime','habits','habitLog','moods','goals'];
    keys.forEach(k => { const v = store.get(k, undefined); if(v!==undefined) data[k]=v; });
    Object.keys(localStorage).filter(k=>k.startsWith('yy_pomo_')).forEach(k=>{ data['__'+k] = JSON.parse(localStorage.getItem(k)); });
    data.__version = 1;
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '杨杨的工作台备份_'+dk()+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('数据已导出 📤');
  },
  importData(){ $('#import-file').click(); }
};

$('#import-file').addEventListener('change', function(){
  const f = this.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k=>{
        if(k === '__version') return;
        if(k.startsWith('__yy_pomo_')) localStorage.setItem(k.slice(2), JSON.stringify(data[k]));
        else store.set(k, data[k]);
      });
      render(); toast('数据导入成功 🎉');
    }catch(err){ toast('导入失败：文件格式不正确'); }
    $('#import-file').value = '';
  };
  r.readAsText(f);
});

/* ---------------- 启动 ---------------- */
window.W = W;
render();
setInterval(updateClock, 1000);
window.addEventListener('beforeunload', ()=>{});
document.addEventListener('visibilitychange', ()=>{
  // 回到页面时刷新（跨天自动重置每日内容）
  if(!document.hidden) render();
});
</script>
